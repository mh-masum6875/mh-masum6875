<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Maidul Hasan Masum, AI engineer and computer vision researcher">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2f2b"/>
      <stop offset="0.55" stop-color="#0f5f58"/>
      <stop offset="1" stop-color="#14877d"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="18" fill="url(#grid)"/>

  <!-- detection-box motif -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">
    <g>
      <rect x="800" y="70" width="170" height="190" rx="4" fill="none" stroke="#5eead4" stroke-width="2.5"/>
      <rect x="800" y="46" width="108" height="24" rx="3" fill="#5eead4"/>
      <text x="810" y="63" fill="#04201c">person 0.97</text>
    </g>
    <g>
      <rect x="990" y="120" width="210" height="120" rx="4" fill="none" stroke="#fcd34d" stroke-width="2.5"/>
      <rect x="990" y="96" width="112" height="24" rx="3" fill="#fcd34d"/>
      <text x="1000" y="113" fill="#3b2a00">vehicle 0.95</text>
    </g>
    <g>
      <rect x="930" y="205" width="110" height="80" rx="4" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2.5"/>
      <rect x="930" y="181" width="112" height="24" rx="3" fill="#ffffff" fill-opacity="0.9"/>
      <text x="940" y="198" fill="#0b2f2b">helmet 0.92</text>
    </g>
  </g>

  <!-- text -->
  <text x="64" y="132" font-family="Iowan Old Style, Palatino Linotype, Palatino, Georgia, serif" font-size="66" font-weight="700" fill="#ffffff">Maidul Hasan Masum</text>
  <text x="66" y="182" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="27" fill="#d1fae5">AI engineer and computer vision researcher</text>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="18" fill="#a7f3d0">
    <text x="66" y="238">Real-time video analytics</text>
    <text x="66" y="266">Efficient models for small devices</text>
    <text x="66" y="294">Published researcher, IEEE Sensors Journal</text>
  </g>
</svg>
